# Copy this to musicsync.toml on EACH machine and edit it there.
# musicsync.toml is gitignored on purpose -- every machine's copy differs
# (different user, different music folder, only the central one has peers).

# Short label used in reports. Use the same three labels everywhere: "iMac", "MacAir", "MacMini".
host_label = "MacMini"

# "central" = this machine pulls from every other peer, merges, and reports.
# "agent"   = this machine only scans itself and waits to be pulled from.
# Pick ONE machine as central (Air or mini, per the setup chat -- mini recommended
# as the one most likely to be always-on).
role = "central"

# Folders to scan on THIS machine. Typical Music.app location (modern macOS):
#   ~/Music/Music/Media.localized/Music
# Typical iTunes location (macOS 10.13 High Sierra and earlier):
#   ~/Music/iTunes/iTunes Media/Music
music_roots = [
  "~/Music/Music/Media.localized/Music",
]

# Where musicsync keeps its own state (snapshot.db, pulled snapshots, the
# merged library.db, and generated reports). Fine to leave as-is.
state_dir = "~/.musicsync"

# The host_label that should have everything (your iMac, per the setup chat).
# The "missing from <primary_host>" report section is relative to this.
primary_host = "iMac"

# --- central-only settings below ---

# Path to a Library.xml exported via:
#   File > Library > Export Library...
# in iTunes (High Sierra) or Music.app (newer macOS) -- same menu, same
# underlying XML format either way.
# (NOT "Export Playlist" on a Purchased smart list -- that skips any
# purchased-but-not-downloaded track entirely. See import_owned.py docstring.)
owned_library_xml = "~/.musicsync/Library.xml"

# Every other peer machine, pulled over SSH using a dedicated key (see
# scripts/setup_ssh.sh and the README). remote_snapshot_path is wherever
# THAT machine's own state_dir/snapshot.db ends up -- i.e. "<their
# state_dir>/snapshot.db". Add as many [[peers]] blocks as you have
# machines -- there's no limit, every entry gets pulled and merged.
[[peers]]
label = "iMac"
user = "paulryanwork"
host = "imac.local"
ssh_key = "~/.ssh/musicsync_ed25519"
remote_snapshot_path = "/Users/paulryanwork/.musicsync/snapshot.db"

[[peers]]
label = "MacAir"
user = "paulryan"
host = "macair.local"
ssh_key = "~/.ssh/musicsync_ed25519"
remote_snapshot_path = "/Users/paulryan/.musicsync/snapshot.db"

# To add another machine, copy one of the blocks above and edit it, e.g.:
# [[peers]]
# label = "MacPro"
# user = "paulryan"
# host = "macpro.local"
# ssh_key = "~/.ssh/musicsync_ed25519"
# remote_snapshot_path = "/Users/paulryan/.musicsync/snapshot.db"

# Optional: your Plex server's music library, pulled over Plex's own HTTP
# API rather than SSH (Plex boxes are often not macOS, so no agent needed
# there at all). Plex becomes just another host in the report -- it folds
# into "missing from iMac"/"missing everywhere" automatically, plus you get
# a dedicated "on Macs but not in Plex" / "in Plex but not on any Mac"
# section. See the README for how to find your X-Plex-Token.
# [plex]
# base_url = "http://minisforum.local:32400"
# token = "YOUR_PLEX_TOKEN"
# library_section = "Music"   # the name of your music library in Plex
# host_label = "Plex"
